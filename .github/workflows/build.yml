name: Build Quest 3 APK

on:
  push:
    branches: [ main, hauptsächlich ]
  workflow_dispatch:

jobs:
  activation:
    name: Request Activation File
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file (.alf)
        uses: game-ci/unity-request-activation-file@v2
        id: getAlf
      - name: Expose as artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-activation-file
          path: ${{ steps.getAlf.outputs.filePath }}

  buildAndroid:
    name: Build Quest 3 APK
    needs: activation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Unity Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: OfflinePet.Editor.BuildScript.BuildQuest3Apk
          buildsPath: Builds/Quest3
          unityVersion: 6000.0.38f1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zimmergeist-Quest3-APK
          path: Builds/Quest3/Zimmergeist.apk
          if-no-files-found: warn
