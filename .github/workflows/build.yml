name: Build Quest 3 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  buildAndroid:
    name: Build Quest 3 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Unity Player
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: Android
          buildMethod: OfflinePet.Editor.BuildScript.BuildQuest3Apk
          buildsPath: Builds/Quest3
          unityVersion: 6000.0.38f1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zimmergeist-Quest3-APK
          path: Builds/Quest3/Zimmergeist.apk
          if-no-files-found: warn
